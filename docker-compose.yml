services:
  postgres:
    image: postgres:16
    container_name: syncora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncora
      POSTGRES_PASSWORD: syncora
      POSTGRES_DB: syncora
    ports:
      - "5432:5432"
    volumes:
      - syncora_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/Syncora.Api/Dockerfile
    container_name: syncora-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=syncora;Username=syncora;Password=syncora
    ports:
      - "5131:8080"

volumes:
  syncora_pgdata:
